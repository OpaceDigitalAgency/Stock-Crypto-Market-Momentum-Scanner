[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://data-api.binance.vision wss://stream.binance.com:443 wss://stream.binance.com:9443 wss://data-stream.binance.vision wss://advanced-trade-ws.coinbase.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
